# Quantumult X 完整配置
# 公开配置不包含个人节点订阅。导入后请在 QX 中添加或保留自己的节点订阅。

[general]
fallback_udp_policy=reject

[dns]
# 不设置自定义 DNS，沿用当前网络的系统 DNS。

[policy]
# 通用代理：Google、Microsoft、YouTube、X、Telegram、Spotify 及最终兜底。
static = 通用代理, server-tag-regex=.*

# ChatGPT：在日本、新加坡之间手动切换。
static = 日本节点, server-tag-regex=(?i)(日本|Japan|Tokyo|Osaka|大阪|东京|🇯🇵|JP)
static = 新加坡节点, server-tag-regex=(?i)(新加坡|Singapore|狮城|🇸🇬|SG)
static = 美国节点, server-tag-regex=(?i)(美国|美國|United.?States|USA|🇺🇸|\bUS\b|Los.?Angeles|San.?Jose|Seattle|New.?York|Chicago|Dallas|Phoenix|Portland|Boston|Miami|Atlanta|Ashburn|Silicon.?Valley)
static = 台湾节点, server-tag-regex=(?i)(台湾|台灣|Taiwan|Taipei|台北|高雄|Kaohsiung|🇹🇼|\bTW\b)
static = ChatGPT, 日本节点, 新加坡节点

# Netflix：只使用香港节点。
static = 香港节点, server-tag-regex=(?i)(香港|Hong.?Kong|🇭🇰|HK|HKG)
static = Netflix-HK, 香港节点

[server_remote]
# 请在 Quantumult X 中单独添加你的节点订阅；不要将含订阅凭据的 URL 发布到公开配置。

[server_local]
# 本配置不内置本地节点。

[filter_local]
# 本机与局域网直连
HOST,localhost,direct
HOST-SUFFIX,local,direct
IP-CIDR,127.0.0.0/8,direct,no-resolve
IP-CIDR,10.0.0.0/8,direct,no-resolve
IP-CIDR,172.16.0.0/12,direct,no-resolve
IP-CIDR,192.168.0.0/16,direct,no-resolve
IP-CIDR,169.254.0.0/16,direct,no-resolve
IP6-CIDR,::1/128,direct,no-resolve
IP6-CIDR,fc00::/7,direct,no-resolve
IP6-CIDR,fe80::/10,direct,no-resolve

# Apple 直连；Apple 规则库也在远程规则区指定为直连。
